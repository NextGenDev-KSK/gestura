[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gestura"
version = "0.2.0"
description = "Offline, AI-powered hand-gesture control for the desktop."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Krithik S" }]
keywords = ["gesture", "hand-tracking", "mediapipe", "accessibility", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture",
]

# --- Runtime dependencies -----------------------------------------------------
# Every dependency below is justified in docs/DECISIONS.md (ADR log).
dependencies = [
    "mediapipe>=0.10.14",          # 21-point hand landmarks, offline, CPU-capable (Apache-2.0)
    "opencv-python>=4.9",          # camera capture + image ops
    "numpy>=1.26",                 # vector math (transitive of mediapipe, pinned explicitly)
    "PySide6>=6.6",                # Qt6 QML UI (LGPL) — GPU-accelerated glassmorphism
    "pydantic>=2.6",               # typed, validated configuration models
    "rich>=13.7",                  # structured, readable console logging/diagnostics

    "pillow>=10.2",                # screen capture (ImageGrab) for the screenshot action

    # ---- Windows integration (guarded so a Linux port can add its own) ----
    # Window management and input injection use ctypes/user32 directly — no extra dependency.
    "pycaw>=20240210;      sys_platform == 'win32'",  # master volume via Core Audio
    "comtypes>=1.3;        sys_platform == 'win32'",  # COM plumbing for pycaw
    "screen-brightness-control>=0.22; sys_platform == 'win32'",  # display brightness
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]
packaging = ["pyinstaller>=6.6"]

[project.scripts]
gestura = "gestura.__main__:main"

[project.urls]
Homepage = "https://github.com/NextGenDev-KSK/gestura"
Documentation = "https://github.com/NextGenDev-KSK/gestura/tree/main/docs"
Issues = "https://github.com/NextGenDev-KSK/gestura/issues"

# --- Tooling ------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/gestura"]
# Ship the QML UI files (and any future non-Python assets) inside the package.
artifacts = ["src/gestura/app/qml/**/*", "src/gestura/**/*.qml", "src/gestura/**/qmldir"]

[tool.hatch.build.targets.wheel.force-include]
"src/gestura/app/qml" = "gestura/app/qml"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises real hardware/heavyweight deps (camera, mediapipe, Qt)",
    "windows: requires the Windows platform",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF012: class-level constant lookup tables don't need ClassVar noise.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# QML requires camelCase for exposed signals/properties/slots — the Qt API dictates these names.
"src/gestura/app/controller.py" = ["N802", "N815"]
"src/gestura/app/camera_view.py" = ["N815"]
# pytest.importorskip must run before the guarded import.
"tests/unit/test_app_controller.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
packages = ["gestura"]
strict = true
warn_unreachable = true
# Teaches mypy pydantic's field defaults/validation (otherwise every model call is a false error).
plugins = ["pydantic.mypy"]
# Third-party libs without type stubs:
[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pycaw.*", "comtypes.*", "screen_brightness_control.*", "win32*"]
ignore_missing_imports = true
